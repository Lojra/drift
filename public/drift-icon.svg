<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0C10" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Concentric subtle vinyl grooves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />

  <!-- Lateral Drift Vector Geometric Mark -->
  <g filter="url(#glow)">
    <!-- Central dynamic pivot -->
    <circle cx="256" cy="256" r="32" fill="#0C0C10" stroke="url(#vectorGrad)" stroke-width="5" />
    <circle cx="256" cy="256" r="10" fill="#3B82F6" />

    <!-- Lateral bridge curved trajectories -->
    <path d="M 120 256 C 180 160, 332 160, 392 256" fill="none" stroke="url(#vectorGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 120 256 C 180 352, 332 352, 392 256" fill="none" stroke="url(#vectorGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8" />

    <!-- Directional arrowheads -->
    <polygon points="392,256 368,244 374,256 368,268" fill="#C084FC" />
    <polygon points="120,256 144,244 138,256 144,268" fill="#3B82F6" />
  </g>
</svg>
